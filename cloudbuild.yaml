steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ip-sentinel:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ip-sentinel:latest'
      - '.'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ip-sentinel:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ip-sentinel:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ip-sentinel'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ip-sentinel:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/ip-sentinel:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ip-sentinel:latest'

options:
  logging: CLOUD_LOGGING_ONLY
