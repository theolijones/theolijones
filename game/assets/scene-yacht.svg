<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9e5e"/><stop offset="40%" stop-color="#ffcf8a"/><stop offset="75%" stop-color="#ffe6b0"/><stop offset="100%" stop-color="#ffd98f"/>
    </linearGradient>
    <linearGradient id="ySea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f89b0"/><stop offset="100%" stop-color="#1f5878"/>
    </linearGradient>
    <linearGradient id="yDeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7d8bd"/><stop offset="100%" stop-color="#b9a37f"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#ySky)"/>
  <!-- sun low on horizon -->
  <circle cx="800" cy="430" r="95" fill="#fff3d0" opacity="0.95"/>
  <circle cx="800" cy="430" r="150" fill="#fff3d0" opacity="0.3"/>
  <!-- sea -->
  <rect y="460" width="1600" height="240" fill="url(#ySea)"/>
  <!-- sun reflection -->
  <g fill="#ffe9b0" opacity="0.55">
    <ellipse cx="800" cy="500" rx="60" ry="6"/><ellipse cx="800" cy="530" rx="90" ry="7"/>
    <ellipse cx="800" cy="565" rx="130" ry="8"/><ellipse cx="800" cy="605" rx="170" ry="9"/>
    <ellipse cx="800" cy="650" rx="220" ry="10"/>
  </g>
  <!-- distant coastline -->
  <path d="M0 460 q220 -26 440 -6 l0 12 q-220 -14 -440 6 z" fill="#8a6a7a" opacity="0.6"/>
  <path d="M1160 456 q220 -20 440 -2 l0 14 q-220 -12 -440 4 z" fill="#8a6a7a" opacity="0.6"/>
  <!-- yacht deck foreground -->
  <path d="M0 700 Q800 640 1600 700 L1600 900 L0 900 Z" fill="url(#yDeck)"/>
  <g stroke="#a48f6c" stroke-width="4" opacity="0.6">
    <path d="M0 760 Q800 706 1600 760" fill="none"/><path d="M0 830 Q800 780 1600 830" fill="none"/>
  </g>
  <!-- polished rail with posts -->
  <g stroke="#f2ede0" stroke-width="10" stroke-linecap="round">
    <line x1="60" y1="560" x2="1540" y2="560"/>
  </g>
  <g stroke="#d8cfb8" stroke-width="8">
    <line x1="120" y1="560" x2="120" y2="690"/><line x1="420" y1="558" x2="420" y2="676"/>
    <line x1="800" y1="556" x2="800" y2="668"/><line x1="1180" y1="558" x2="1180" y2="676"/>
    <line x1="1480" y1="560" x2="1480" y2="690"/>
  </g>
  <!-- deck lounge chairs (silhouette) -->
  <g fill="#7a6a4e" opacity="0.85">
    <path d="M180 700 l30 -70 l70 0 l-14 70 z"/>
    <path d="M1330 700 l-30 -70 l-70 0 l14 70 z"/>
  </g>
  <!-- champagne bucket -->
  <g transform="translate(1120,640)">
    <path d="M-34 0 h68 l-10 60 h-48 z" fill="#c9c2a8"/>
    <ellipse cx="0" cy="0" rx="34" ry="10" fill="#e3ddc6"/>
    <rect x="-8" y="-46" width="16" height="48" fill="#1f5030"/>
    <path d="M-8 -46 q8 -12 16 0 z" fill="#d9b64a"/>
  </g>
  <rect width="1600" height="900" fill="#ff8a3d" opacity="0.06"/>
</svg>
