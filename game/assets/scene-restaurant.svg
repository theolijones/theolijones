<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="rWarm" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#5a3820"/><stop offset="45%" stop-color="#2c1a10"/><stop offset="100%" stop-color="#0a0605"/>
    </radialGradient>
    <linearGradient id="rTable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9bda6"/><stop offset="100%" stop-color="#8a7f6a"/>
    </linearGradient>
    <radialGradient id="bokeh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcf7a" stop-opacity="0.9"/><stop offset="100%" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="candle" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff3c0"/><stop offset="60%" stop-color="#ffab3d"/><stop offset="100%" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#rWarm)"/>
  <!-- back wall drapes -->
  <g opacity="0.5">
    <rect x="0" y="0" width="1600" height="520" fill="#241009"/>
    <path d="M0 0 h1600 v40 q-100 40 -200 0 q-100 -40 -200 0 q-100 40 -200 0 q-100 -40 -200 0 q-100 40 -200 0 q-100 -40 -200 0 q-100 40 -200 0 z" fill="#3a1a0e"/>
  </g>
  <!-- soft bokeh lights -->
  <g>
    <circle cx="180" cy="180" r="60" fill="url(#bokeh)"/>
    <circle cx="470" cy="120" r="40" fill="url(#bokeh)" opacity="0.7"/>
    <circle cx="1180" cy="150" r="70" fill="url(#bokeh)"/>
    <circle cx="1440" cy="220" r="50" fill="url(#bokeh)" opacity="0.8"/>
    <circle cx="820" cy="90"  r="35" fill="url(#bokeh)" opacity="0.6"/>
    <circle cx="1330" cy="90" r="28" fill="url(#bokeh)" opacity="0.6"/>
  </g>
  <!-- hanging pendant lamps -->
  <g stroke="#5a3a1e" stroke-width="3">
    <line x1="300" y1="0" x2="300" y2="150"/><line x1="1300" y1="0" x2="1300" y2="130"/>
  </g>
  <ellipse cx="300" cy="165" rx="46" ry="26" fill="#2a1608"/>
  <ellipse cx="300" cy="172" rx="40" ry="16" fill="#ffb347" opacity="0.8"/>
  <ellipse cx="1300" cy="145" rx="42" ry="24" fill="#2a1608"/>
  <ellipse cx="1300" cy="152" rx="36" ry="14" fill="#ffb347" opacity="0.8"/>
  <!-- distant seated diner silhouettes -->
  <g fill="#180b06" opacity="0.85">
    <ellipse cx="150" cy="470" rx="55" ry="70"/><circle cx="150" cy="405" r="30"/>
    <ellipse cx="1470" cy="470" rx="55" ry="70"/><circle cx="1470" cy="405" r="30"/>
    <ellipse cx="1360" cy="500" rx="48" ry="60" opacity="0.7"/><circle cx="1360" cy="445" r="26" opacity="0.7"/>
  </g>
  <!-- foreground round table -->
  <ellipse cx="800" cy="820" rx="760" ry="180" fill="url(#rTable)"/>
  <ellipse cx="800" cy="812" rx="760" ry="150" fill="#d8cdb4" opacity="0.5"/>
  <!-- candle glow + flame -->
  <ellipse cx="560" cy="640" rx="120" ry="120" fill="url(#candle)" opacity="0.55"/>
  <rect x="551" y="628" width="18" height="46" rx="4" fill="#efe6cf"/>
  <path d="M560 600 q-13 20 0 34 q13 -14 0 -34 z" fill="#ffd257"/>
  <path d="M560 606 q-7 12 0 22 q7 -10 0 -22 z" fill="#fff3c0"/>
  <!-- wine glass -->
  <g transform="translate(1050,600)">
    <path d="M0 0 q40 0 40 44 q0 40 -40 46 q-40 -6 -40 -46 q0 -44 40 -44 z" fill="#6d1226" opacity="0.85"/>
    <path d="M0 0 q40 0 40 44 q0 8 -6 16 q-16 8 -34 8 q-18 0 -34 -8 q-6 -8 -6 -16 q0 -44 40 -44 z" fill="#8e1a33" opacity="0.6"/>
    <rect x="-3" y="90" width="6" height="70" fill="#e9dfc8" opacity="0.6"/>
    <ellipse cx="0" cy="164" rx="34" ry="8" fill="#e9dfc8" opacity="0.6"/>
  </g>
  <!-- envelope prop (hidden by default, shown by game) -->
  <g id="prop-envelope" opacity="0" transform="translate(780,700)">
    <rect x="-70" y="-40" width="140" height="80" rx="6" fill="#f3efe2" stroke="#c9c1a8" stroke-width="2"/>
    <path d="M-70 -38 L0 12 L70 -38" fill="none" stroke="#c9c1a8" stroke-width="3"/>
  </g>
  <rect width="1600" height="900" fill="#000" opacity="0.12"/>
</svg>
