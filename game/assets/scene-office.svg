<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="oWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4a26"/><stop offset="100%" stop-color="#3a2613"/>
    </linearGradient>
    <linearGradient id="oSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fb7d6"/><stop offset="55%" stop-color="#cfe0e8"/><stop offset="100%" stop-color="#e8dcc0"/>
    </linearGradient>
    <linearGradient id="oDesk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4f28"/><stop offset="100%" stop-color="#4a2f16"/>
    </linearGradient>
    <radialGradient id="oGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff2cf" stop-opacity="0.35"/><stop offset="100%" stop-color="#fff2cf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#oWall)"/>
  <!-- wood panelling -->
  <g stroke="#2e1d0e" stroke-width="2" opacity="0.4">
    <line x1="200" y1="0" x2="200" y2="600"/><line x1="1400" y1="0" x2="1400" y2="600"/>
    <line x1="0" y1="120" x2="1600" y2="120"/><line x1="0" y1="470" x2="1600" y2="470"/>
  </g>
  <!-- big window with skyline -->
  <rect x="520" y="80" width="560" height="380" rx="6" fill="url(#oSky)" stroke="#2e1d0e" stroke-width="10"/>
  <g fill="#9fb0bd" opacity="0.85">
    <rect x="560" y="300" width="50" height="160"/><rect x="625" y="250" width="60" height="210"/>
    <rect x="700" y="320" width="46" height="140"/><rect x="760" y="220" width="70" height="240"/>
    <rect x="845" y="300" width="52" height="160"/><rect x="910" y="270" width="60" height="190"/>
    <rect x="985" y="330" width="48" height="130"/>
  </g>
  <g fill="#ffe9a8" opacity="0.7">
    <rect x="635" y="270" width="10" height="12"/><rect x="655" y="300" width="10" height="12"/>
    <rect x="775" y="250" width="10" height="12"/><rect x="800" y="290" width="10" height="12"/>
    <rect x="920" y="300" width="10" height="12"/>
  </g>
  <line x1="800" y1="80" x2="800" y2="460" stroke="#2e1d0e" stroke-width="6"/>
  <line x1="520" y1="270" x2="1080" y2="270" stroke="#2e1d0e" stroke-width="6"/>
  <!-- flags flanking window -->
  <g transform="translate(360,110)"><rect x="-4" y="0" width="8" height="360" fill="#3a2613"/><path d="M4 0 q90 30 0 60 z" fill="#c9a24a"/></g>
  <g transform="translate(1240,110)"><rect x="-4" y="0" width="8" height="360" fill="#3a2613"/><path d="M-4 0 q-90 30 0 60 z" fill="#c9a24a"/></g>
  <!-- bookshelves -->
  <g transform="translate(30,150)">
    <rect x="0" y="0" width="150" height="320" fill="#33200f"/>
    <g fill="#7a4224"><rect x="12" y="10" width="18" height="90"/><rect x="34" y="16" width="16" height="84"/><rect x="54" y="8" width="20" height="92"/><rect x="80" y="14" width="16" height="86"/><rect x="100" y="10" width="22" height="90"/></g>
    <g fill="#4a6a4a"><rect x="12" y="120" width="20" height="90"/><rect x="36" y="126" width="16" height="84"/><rect x="58" y="118" width="18" height="92"/><rect x="82" y="124" width="20" height="86"/></g>
    <g fill="#8a6a2a"><rect x="12" y="230" width="18" height="80"/><rect x="34" y="236" width="20" height="74"/><rect x="60" y="228" width="16" height="82"/><rect x="82" y="234" width="22" height="76"/></g>
  </g>
  <!-- ceiling glow -->
  <ellipse cx="800" cy="120" rx="700" ry="200" fill="url(#oGlow)"/>
  <!-- grand desk foreground -->
  <path d="M120 900 L120 660 Q800 600 1480 660 L1480 900 Z" fill="url(#oDesk)"/>
  <ellipse cx="800" cy="662" rx="690" ry="60" fill="#8a5a2e" opacity="0.6"/>
  <!-- desk lamp -->
  <g transform="translate(1180,560)">
    <rect x="-6" y="40" width="12" height="70" fill="#2a1a0c"/><ellipse cx="0" cy="118" rx="40" ry="10" fill="#2a1a0c"/>
    <path d="M0 40 L40 0" stroke="#2a1a0c" stroke-width="10"/>
    <path d="M20 -14 h50 l-14 34 h-50 z" fill="#1f9d55"/>
    <ellipse cx="30" cy="60" rx="70" ry="30" fill="#fff2cf" opacity="0.25"/>
  </g>
  <rect width="1600" height="900" fill="#000" opacity="0.08"/>
</svg>
