<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velox Companion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0A0A0F;
      color: #E8E8ED;
      overflow: hidden;
      height: 100vh;
    }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid #1E1E2A;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header .subtitle { font-size: 11px; color: #6B6B80; font-family: 'DM Mono', monospace; }
    .controls { display: flex; gap: 8px; }
    .btn {
      padding: 6px 14px; border-radius: 8px; border: 1px solid #2A2A3A;
      background: #13131A; color: #E8E8ED; font-size: 12px; cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { border-color: #3A3A4A; }
    .btn.primary { background: #00E5CC; color: #0A0A0F; border-color: #00E5CC; }
    .btn.primary:hover { background: #00CCAA; }
    .btn.danger { color: #FF4466; border-color: #FF4466/30; }
    .content { flex: 1; overflow-y: auto; padding: 16px 20px; }

    .section {
      background: #13131A; border: 1px solid #1E1E2A; border-radius: 12px;
      padding: 16px; margin-bottom: 16px;
    }
    .section-title {
      font-size: 10px; font-family: 'DM Mono', monospace; text-transform: uppercase;
      letter-spacing: 0.1em; color: #6B6B80; margin-bottom: 12px;
    }

    .folder-card {
      display: flex; align-items: center; gap: 12px;
      background: #0A0A0F; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    }
    .folder-status {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .folder-status.active { background: #00E5CC; }
    .folder-status.paused { background: #6B6B80; }
    .folder-status.error { background: #FF4466; }
    .folder-path { font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .folder-meta { font-size: 10px; color: #6B6B80; font-family: 'DM Mono', monospace; }
    .folder-actions { display: flex; gap: 4px; }
    .icon-btn {
      width: 28px; height: 28px; border-radius: 6px; border: 1px solid #2A2A3A;
      background: transparent; color: #6B6B80; cursor: pointer; display: flex;
      align-items: center; justify-content: center; font-size: 14px; transition: all 0.2s;
    }
    .icon-btn:hover { color: #E8E8ED; border-color: #3A3A4A; }
    .icon-btn.danger:hover { color: #FF4466; }

    .log-container { max-height: 300px; overflow-y: auto; }
    .log-entry {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid #1E1E2A; font-size: 12px;
    }
    .log-type {
      font-size: 9px; font-family: 'DM Mono', monospace; text-transform: uppercase;
      padding: 2px 6px; border-radius: 4px; flex-shrink: 0;
    }
    .log-type.file_detected { background: #00E5CC20; color: #00E5CC; }
    .log-type.upload_started { background: #3B82F620; color: #3B82F6; }
    .log-type.upload_progress { background: #3B82F620; color: #3B82F6; }
    .log-type.upload_complete { background: #22C55E20; color: #22C55E; }
    .log-type.upload_failed { background: #FF446620; color: #FF4466; }
    .log-type.api_created { background: #A855F720; color: #A855F7; }
    .log-type.error { background: #FF446620; color: #FF4466; }
    .log-msg { color: #A0A0B4; flex: 1; }

    .empty-state {
      text-align: center; padding: 40px 20px; color: #6B6B80; font-size: 13px;
    }

    .settings-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .input-group { margin-bottom: 12px; }
    .input-group label {
      display: block; font-size: 10px; color: #6B6B80; margin-bottom: 4px;
      font-family: 'DM Mono', monospace; text-transform: uppercase;
    }
    .input-group input {
      width: 100%; background: #0A0A0F; border: 1px solid #2A2A3A; border-radius: 6px;
      padding: 8px 10px; color: #E8E8ED; font-size: 12px; font-family: 'DM Mono', monospace;
      outline: none; transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: #00E5CC; }

    .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .tab {
      padding: 6px 16px; border-radius: 6px; background: transparent;
      border: 1px solid transparent; color: #6B6B80; font-size: 12px;
      cursor: pointer; transition: all 0.2s;
    }
    .tab.active { background: #00E5CC10; border-color: #00E5CC30; color: #00E5CC; }
    .tab:hover:not(.active) { color: #E8E8ED; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h1>Velox Companion</h1>
        <div class="subtitle" id="status-text">Idle — 0 active watchers</div>
      </div>
      <div class="controls">
        <button class="btn" onclick="stopAll()">Stop All</button>
        <button class="btn primary" onclick="startAll()">Start All</button>
      </div>
    </div>

    <div style="padding: 8px 20px 0;">
      <div class="tabs">
        <button class="tab active" onclick="switchTab(this, 'folders')">Watch Folders</button>
        <button class="tab" onclick="switchTab(this, 'log')">Activity Log</button>
        <button class="tab" onclick="switchTab(this, 'settings')">Settings</button>
      </div>
    </div>

    <div class="content">
      <!-- Folders Tab -->
      <div id="tab-folders">
        <div style="display:flex; justify-content: flex-end; margin-bottom: 12px;">
          <button class="btn primary" onclick="addFolder()">+ Add Watch Folder</button>
        </div>
        <div id="folders-list">
          <div class="empty-state">No watch folders configured. Click "Add Watch Folder" to get started.</div>
        </div>
      </div>

      <!-- Log Tab -->
      <div id="tab-log" style="display:none;">
        <div class="section">
          <div class="section-title">Activity Log</div>
          <div class="log-container" id="log-container">
            <div class="empty-state">No activity yet. Start watching folders to see events.</div>
          </div>
        </div>
      </div>

      <!-- Settings Tab -->
      <div id="tab-settings" style="display:none;">
        <div class="section">
          <div class="section-title">API Connection</div>
          <div class="settings-grid">
            <div class="input-group">
              <label>API Base URL</label>
              <input type="text" id="cfg-apiBaseUrl" placeholder="http://localhost:3001/api/v1">
            </div>
            <div class="input-group">
              <label>API Token</label>
              <input type="password" id="cfg-apiToken" placeholder="Bearer token">
            </div>
          </div>
        </div>
        <div class="section">
          <div class="section-title">S3 Configuration</div>
          <div class="settings-grid">
            <div class="input-group">
              <label>Region</label>
              <input type="text" id="cfg-s3Region" placeholder="ap-southeast-2">
            </div>
            <div class="input-group">
              <label>Bucket</label>
              <input type="text" id="cfg-s3Bucket" placeholder="velox-video-source">
            </div>
            <div class="input-group">
              <label>Access Key ID</label>
              <input type="text" id="cfg-s3AccessKeyId" placeholder="AKIA...">
            </div>
            <div class="input-group">
              <label>Secret Access Key</label>
              <input type="password" id="cfg-s3SecretAccessKey" placeholder="Secret key">
            </div>
          </div>
        </div>
        <div style="text-align: right;">
          <button class="btn primary" onclick="saveSettings()">Save Settings</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    // Tab switching
    function switchTab(btn, tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      ['folders', 'log', 'settings'].forEach(id => {
        document.getElementById('tab-' + id).style.display = id === tabId ? 'block' : 'none';
      });
    }

    // Load data
    async function loadFolders() {
      const folders = await ipcRenderer.invoke('get-watch-folders');
      const container = document.getElementById('folders-list');
      if (!folders || folders.length === 0) {
        container.innerHTML = '<div class="empty-state">No watch folders configured.</div>';
        return;
      }
      container.innerHTML = folders.map(f => `
        <div class="folder-card">
          <div class="folder-status ${f.status}"></div>
          <div style="flex:1;min-width:0">
            <div class="folder-path">${f.localPath}</div>
            <div class="folder-meta">${f.status} · ${f.s3Destination || 'uploads'}</div>
          </div>
          <div class="folder-actions">
            <button class="icon-btn" onclick="toggleFolder('${f.id}')" title="${f.status === 'active' ? 'Pause' : 'Start'}">
              ${f.status === 'active' ? '⏸' : '▶'}
            </button>
            <button class="icon-btn danger" onclick="removeFolder('${f.id}')" title="Remove">✕</button>
          </div>
        </div>
      `).join('');

      const active = folders.filter(f => f.status === 'active').length;
      document.getElementById('status-text').textContent = `${active} active watcher${active !== 1 ? 's' : ''}`;
    }

    async function loadSettings() {
      const config = await ipcRenderer.invoke('get-config');
      ['apiBaseUrl','apiToken','s3Region','s3Bucket','s3AccessKeyId','s3SecretAccessKey'].forEach(key => {
        const el = document.getElementById('cfg-' + key);
        if (el) el.value = config[key] || '';
      });
    }

    // Actions
    async function addFolder() { await ipcRenderer.invoke('add-watch-folder'); loadFolders(); }
    async function removeFolder(id) { await ipcRenderer.invoke('remove-watch-folder', id); loadFolders(); }
    async function toggleFolder(id) { await ipcRenderer.invoke('toggle-watch-folder', id); loadFolders(); }
    async function startAll() { await ipcRenderer.invoke('start-all-watchers'); loadFolders(); }
    async function stopAll() { await ipcRenderer.invoke('stop-all-watchers'); loadFolders(); }

    async function saveSettings() {
      const config = {};
      ['apiBaseUrl','apiToken','s3Region','s3Bucket','s3AccessKeyId','s3SecretAccessKey'].forEach(key => {
        config[key] = document.getElementById('cfg-' + key).value;
      });
      await ipcRenderer.invoke('set-config', config);
      alert('Settings saved!');
    }

    // Log events
    ipcRenderer.on('watch-event', (_, event) => {
      const container = document.getElementById('log-container');
      const empty = container.querySelector('.empty-state');
      if (empty) empty.remove();

      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `
        <span class="log-type ${event.type}">${event.type.replace(/_/g, ' ')}</span>
        <span class="log-msg">${event.message}</span>
      `;
      container.insertBefore(entry, container.firstChild);
    });

    // Init
    loadFolders();
    loadSettings();
  </script>
</body>
</html>
